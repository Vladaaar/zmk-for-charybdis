# Общие Bluetooth / производительность настройки (оставь как есть)
# CONFIG_BT_LL_SW_LLCP_LEGACY=y
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# RGB (если используешь, раскомментируй нужное)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Обязательно для PMW3610 на Zephyr 4.1 + badjeff-драйвер
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y           # ← включает pointing / mouse emulation в ZMK
CONFIG_PMW3610_ALT=y            # ← КЛЮЧЕВОЕ: именно ALT, а не PMW3610

# Опционально: отладка (если трекбол не работает — раскомментируй)
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
